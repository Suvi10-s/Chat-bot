<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0"/>

    <title>AI RAG Chatbot</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:Arial, sans-serif;

            background:
            linear-gradient(
                135deg,
                #020617,
                #0f172a,
                #1e293b
            );

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:30px;

            color:white;
        }

        .container{

            width:100%;

            max-width:1000px;

            background:rgba(255,255,255,0.06);

            border:1px solid rgba(255,255,255,0.08);

            backdrop-filter:blur(15px);

            border-radius:24px;

            padding:30px;

            box-shadow:
            0 10px 40px rgba(0,0,0,0.5);
        }

        .title{

            text-align:center;

            font-size:42px;

            margin-bottom:10px;

            font-weight:bold;

            background:linear-gradient(
                to right,
                #60a5fa,
                #22d3ee
            );

            -webkit-background-clip:text;

            background-clip:text;

            -webkit-text-fill-color:transparent;
        }

        .subtitle{

            text-align:center;

            color:#cbd5e1;

            margin-bottom:30px;
        }

        .top-section{

            display:grid;

            grid-template-columns:1fr 1fr;

            gap:20px;

            margin-bottom:25px;
        }

        .card{

            background:rgba(255,255,255,0.05);

            border:1px solid rgba(255,255,255,0.08);

            border-radius:18px;

            padding:20px;
        }

        .card h2{

            margin-bottom:18px;

            font-size:20px;
        }

        .buttons{

            display:flex;

            gap:12px;

            flex-wrap:wrap;
        }

        button{

            border:none;

            outline:none;

            padding:12px 20px;

            border-radius:12px;

            cursor:pointer;

            font-size:15px;

            font-weight:bold;

            transition:0.3s;
        }

        .connect-btn{

            background:#2563eb;

            color:white;
        }

        .connect-btn:hover{

            background:#1d4ed8;

            transform:translateY(-2px);
        }

        .disconnect-btn{

            background:#dc2626;

            color:white;
        }

        .disconnect-btn:hover{

            background:#b91c1c;

            transform:translateY(-2px);
        }

        .upload-btn{

            background:#059669;

            color:white;
        }

        .upload-btn:hover{

            background:#047857;

            transform:translateY(-2px);
        }

        .status{

            margin-top:15px;

            font-size:15px;

            color:#4ade80;
        }

        input[type="file"]{

            width:100%;

            margin-bottom:15px;

            color:white;
        }

        .chat-section{

            margin-top:20px;
        }

        .chat-box{

            height:420px;

            overflow-y:auto;

            background:rgba(0,0,0,0.25);

            border:1px solid rgba(255,255,255,0.08);

            border-radius:18px;

            padding:20px;

            margin-bottom:20px;

            scroll-behavior:smooth;
        }

        .message{

            margin-bottom:18px;

            padding:14px;

            border-radius:14px;

            line-height:1.7;

            width:fit-content;

            max-width:85%;
        }

        .user{

            background:#2563eb;

            margin-left:auto;
        }

        .bot{

            background:#334155;
        }

        .input-area{

            display:flex;

            gap:12px;
        }

        .input-area input{

            flex:1;

            padding:15px;

            border:none;

            outline:none;

            border-radius:14px;

            background:rgba(255,255,255,0.08);

            color:white;

            font-size:16px;
        }

        .send-btn{

            background:#7c3aed;

            color:white;

            min-width:120px;
        }

        .send-btn:hover{

            background:#6d28d9;

            transform:translateY(-2px);
        }

        .typing{

            color:#94a3b8;

            font-style:italic;

            margin-top:10px;
        }

        @media(max-width:768px){

            .top-section{

                grid-template-columns:1fr;
            }

            .input-area{

                flex-direction:column;
            }

            .send-btn{

                width:100%;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="title">
            AI RAG Chatbot
        </div>

        <div class="subtitle">
            Upload PDF • Ask Questions • Get AI Answers
        </div>

        <div class="top-section">

            <!-- CONNECTION -->

            <div class="card">

                <h2>
                    WebSocket Connection
                </h2>

                <div class="buttons">

                    <button
                        class="connect-btn"
                        onclick="connectSocket()"
                    >
                        Connect
                    </button>

                    <button
                        class="disconnect-btn"
                        onclick="disconnectSocket()"
                    >
                        Disconnect
                    </button>

                </div>

                <div
                    class="status"
                    id="status"
                >
                    Disconnected
                </div>

            </div>

            <!-- UPLOAD -->

            <div class="card">

                <h2>
                    Upload PDF
                </h2>

                <input
                    type="file"
                    id="pdfFile"
                    accept=".pdf"
                >

                <button
                    class="upload-btn"
                    onclick="uploadPDF()"
                >
                    Upload PDF
                </button>

            </div>

        </div>

        <!-- CHAT -->

        <div class="chat-section">

            <div
                class="chat-box"
                id="chatBox"
            >

            </div>

            <div class="typing" id="typing">

            </div>

            <div class="input-area">

                <input
                    type="text"
                    id="message"
                    placeholder="Ask something about your PDF..."
                >

                <button
                    class="send-btn"
                    onclick="sendMessage()"
                >
                    Send
                </button>

            </div>

        </div>

    </div>


    <script>

        let socket = null;

        let botDiv = null;


        // CONNECT SOCKET

        function connectSocket(){

            socket = new WebSocket(
                "ws://127.0.0.1:8000/chat"
            );

            socket.onopen = () => {

                document.getElementById("status")
                .innerText = "Connected";

                console.log("Connected");
            };


            socket.onmessage = (event) => {

                if(event.data === "[END]"){

                    document.getElementById("typing")
                    .innerText = "";

                    botDiv = null;

                    return;
                }

                if(!botDiv){

                    botDiv = document.createElement("div");

                    botDiv.className = "message bot";

                    document.getElementById("chatBox")
                    .appendChild(botDiv);
                }

                botDiv.innerHTML += event.data;

                scrollBottom();
            };


            socket.onclose = () => {

                document.getElementById("status")
                .innerText = "Disconnected";

                console.log("Disconnected");
            };
        }



        // DISCONNECT

        function disconnectSocket(){

            if(socket){

                socket.close();
            }
        }



        // SEND MESSAGE

        function sendMessage(){

            const input =
            document.getElementById("message");

            const message = input.value.trim();

            if(message === "") return;

            if(!socket){

                alert("Connect websocket first");

                return;
            }

            // USER MESSAGE

            const userDiv =
            document.createElement("div");

            userDiv.className =
            "message user";

            userDiv.innerText = message;

            document.getElementById("chatBox")
            .appendChild(userDiv);

            // SHOW TYPING

            document.getElementById("typing")
            .innerText = "AI typing...";

            socket.send(message);

            input.value = "";

            scrollBottom();
        }



        // UPLOAD PDF

        async function uploadPDF(){

            const fileInput =
            document.getElementById("pdfFile");

            const file =
            fileInput.files[0];

            if(!file){

                alert("Choose PDF file");

                return;
            }

            const formData =
            new FormData();

            formData.append(
                "file",
                file
            );

            try{

                const response = await fetch(
                    "http://127.0.0.1:8000/upload",
                    {
                        method:"POST",
                        body:formData
                    }
                );

                const data =
                await response.json();

                alert(data.uploaded);

                console.log(data);

            }catch(error){

                console.log(error);

                alert("Upload failed");
            }
        }



        // AUTO SCROLL

        function scrollBottom(){

            const chatBox =
            document.getElementById("chatBox");

            chatBox.scrollTop =
            chatBox.scrollHeight;
        }



        // ENTER KEY

        document
        .getElementById("message")
        .addEventListener(
            "keypress",
            function(event){

                if(event.key === "Enter"){

                    sendMessage();
                }
            }
        );

    </script>

</body>
</html>
